name: Release Windows

# Builds a real x64 Windows installer on windows-latest and publishes it to
# GitHub Releases (including latest.yml so installed apps can auto-update).
# Cross-building NSIS from macOS often produces installers that only
# contain the uninstaller — then Windows can't find Everkeep.exe.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Require production sharing configuration
        run: node scripts/verify-release-sharing.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows x64 installer
        run: npm run build && node scripts/verify-release-sharing.mjs --built && npx electron-builder --win --x64 --publish always
        env:
      EVERKEEP_SHARING_URL: ${{ vars.EVERKEEP_SHARING_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: everkeep-windows-x64
          path: |
            release/Everkeep-win-x64.exe
            release/Everkeep-win-x64.zip
            release/latest.yml
