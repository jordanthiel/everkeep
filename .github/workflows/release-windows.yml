name: Release Windows

# Builds a real x64 Windows installer on windows-latest.
# Cross-building NSIS from macOS often produces installers that only
# contain the uninstaller — then Windows can't find Everkeep.exe.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 installer
        run: npm run dist:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: everkeep-windows-x64
          path: |
            release/Everkeep-win-x64.exe
            release/Everkeep-win-x64.zip
