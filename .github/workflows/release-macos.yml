name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      EVERKEEP_SHARING_URL: ${{ vars.EVERKEEP_SHARING_URL }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require release credentials
        shell: bash
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. Configure macOS release secrets as described in README.md."
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Require production sharing configuration
        run: node scripts/verify-release-sharing.mjs

      - name: Install dependencies
        run: npm ci

      # One invocation merges both architectures into latest-mac.yml.
      # afterSign validates each notarized app before packaging/uploading it.
      - name: Build, sign, notarize, verify, and publish macOS installers
        run: npm run build && node scripts/verify-release-sharing.mjs --built && npx electron-builder --mac --arm64 --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: everkeep-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
